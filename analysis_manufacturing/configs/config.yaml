dataset:
  image:
    bbox_model: superpixel
    path: ../data/source/dataset_public_manufacturing_defects
display:
  monitor:
    name: study_monitor
    resolution:
      - 3440
      - 1440
    width: 53
    distance: 60
    display_number: 0
  gui:
    button:
      size:
        - 250
        - 100
      margin: 20
      color: lightgrey
      text:
        color: black
        size: 30
    fixation_dot:
      size: 10
      color: white
    aoe:
      - 800
      - 800
output:
  folder: ../output/manufacturing
instructions:
  intro:
    - "Welcome to the CoinDefect6k study."
    - "Inspect each coin image and classify it as good or bad."
    - "Express all your thought out loud -- your comments will be transcribed and aligned with gaze"
    - "If you are using mouse, remember to press and hold right mouse button to simulate gaze"
    - "Press SPACE to begin."
  outro:
    - "Thank you."
    - "Your responses and gaze recordings have been saved."
